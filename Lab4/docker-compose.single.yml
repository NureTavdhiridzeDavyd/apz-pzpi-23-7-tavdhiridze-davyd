services:
  backend-1:
    build: .
    container_name: hivetrack-backend-1
    environment:
      PORT: 3000
      INSTANCE_ID: backend-1
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SSL: ${DB_SSL}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-10}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3h}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: hivetrack-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.single.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
    restart: unless-stopped
